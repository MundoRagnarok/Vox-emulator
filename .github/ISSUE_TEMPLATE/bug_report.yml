name: Relato de Bug
description: Relate um problema reproduzível no emulador, servidor ou inicializador
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Obrigado por ajudar a comunidade a identificar problemas!
        Por favor, forneça o máximo de detalhes possível para que possamos reproduzir o erro.
        **Atenção:** Remova senhas, chaves privadas, IPs públicos ou arquivos proprietários de logs ou anexos.
  - type: input
    id: versao
    attributes:
      label: Versão ou Commit
      description: Hash do commit, versão da release ou data em que clonou o repositório.
      placeholder: ex: main em abc1234 ou Release v1.0.0
    validations:
      required: true
  - type: input
    id: plataforma
    attributes:
      label: Sistema Operacional e versão do .NET
      placeholder: ex: Windows 11 x64, .NET 10.0.100
    validations:
      required: true
  - type: textarea
    id: ambiente
    attributes:
      label: Configuração e comandos utilizados
      description: O que você estava executando (servidor local solo, servidor host para amigos, etc.)?
      placeholder: Rodando RO3Emu.exe local com dados exportados; configurações padrão.
    validations:
      required: true
  - type: textarea
    id: passos
    attributes:
      label: Passos para reproduzir o problema
      placeholder: |
        1. Inicie o emulador...
        2. Crie um personagem da classe...
        3. Vá até o mapa... e utilize a habilidade...
        4. O servidor exibe a mensagem de erro...
    validations:
      required: true
  - type: textarea
    id: comportamento
    attributes:
      label: Comportamento esperado vs Comportamento ocorrido
      placeholder: Esperava-se que o monstro sofresse dano; em vez disso, o servidor desconectou o cliente.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Trecho relevante de logs ou evidências
      description: Cole um trecho sanitizado do log do console ou da pasta logs/. Se você gerou o 'RO3Emu.exe diag', mencione aqui.
      render: text
    validations:
      required: false
  - type: textarea
    id: testes_tentados
    attributes:
      label: Testes ou tentativas de solução já realizadas
      description: Descreva se tentou reiniciar, recriar a conta ou restaurar o cliente com RO3Emu.exe restore.
    validations:
      required: false
