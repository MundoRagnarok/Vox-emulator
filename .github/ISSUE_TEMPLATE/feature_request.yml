name: Sugestão de Funcionalidade ou Paridade
description: Proponha uma melhoria de mecânica, paridade com o servidor oficial ou novo recurso
title: "[Sugestão/Paridade]: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Ajude a planejar os próximos passos do emulador brasileiro!
        Lembre-se de que nosso objetivo é a estabilidade inicial e posterior paridade 1:1 com o servidor oficial do RO3.
  - type: textarea
    id: problema_ou_caso_de_uso
    attributes:
      label: Caso de uso ou problema a ser resolvido
      description: O que um jogador, operador de servidor ou desenvolvedor deveria conseguir fazer?
    validations:
      required: true
  - type: textarea
    id: comportamento_proposto
    attributes:
      label: Comportamento proposto
      description: Descreva detalhadamente como o recurso deve funcionar no jogo.
    validations:
      required: true
  - type: textarea
    id: evidencias
    attributes:
      label: Evidências do cliente ou documentação oficial
      description: Inclua caminhos de arquivos Lua, tabelas de configuração, IDs de mensagens ou vídeos/prints do jogo oficial quando disponíveis.
    validations:
      required: false
